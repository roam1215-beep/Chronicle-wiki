<h2 class="sr-only">사냥꾼 카드 30장 완성 — 인물18·기도6·책략3·장비3</h2>
<div style="padding:0.5rem 0;">
  <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem;">
    <button class="sortbtn active" data-mode="analysis">종합</button>
    <button class="sortbtn" data-mode="group">종류·타입별</button>
    <button class="sortbtn" data-mode="cost">코스트순</button>
    <button class="sortbtn" data-mode="tier">등급순</button>
  </div>
  <div id="out"></div>
</div>
<style>
.sortbtn{font-size:13px; padding:6px 12px; border:0.5px solid var(--color-border-secondary); border-radius:var(--border-radius-md); background:transparent; color:var(--color-text-secondary); cursor:pointer;}
.sortbtn.active{border:2px solid var(--color-border-info); color:var(--color-text-primary); padding:5px 11px;}
.bar{height:22px; border-radius:4px; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:500; color:#2C2C2A; white-space:nowrap;}
.mc{background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.8rem 1rem;}
.mc .lab{font-size:12px; color:var(--color-text-secondary); margin-bottom:3px;}
.mc .num{font-size:22px; font-weight:500; color:var(--color-text-primary);}
</style>
<script>
const TIER={common:{ko:'보통',bg:'#F1EFE8',fg:'#2C2C2A'},rare:{ko:'희귀',bg:'#E6F1FB',fg:'#0C447C'},epic:{ko:'영웅',bg:'#EEEDFE',fg:'#26215C'},legendary:{ko:'전설',bg:'#FAEEDA',fg:'#412402'}};
const TIERBAR={common:{ko:'보통',c:'#B4B2A9'},rare:{ko:'희귀',c:'#85B7EB'},epic:{ko:'영웅',c:'#AFA9EC'},legendary:{ko:'전설',c:'#EF9F27'}};
const TYPE={soldier:'보병',rider:'기수',scout:'척후',herald:'전령',shifting:'변동','-':'—'};
const TYPECOLOR={soldier:'#D3D1C7',rider:'#B5D4F4',scout:'#9FE1CB',herald:'#CECBF6',shifting:'#ED93B1'};
const KIND={unit:{ko:'인물',icon:'ti-users',ord:0,color:'#888780'},gear:{ko:'장비',icon:'ti-sword',ord:1,color:'#D85A30'},spell:{ko:'기도',icon:'ti-pray',ord:2,color:'#1D9E75'},strat:{ko:'책략',icon:'ti-map-pin',ord:3,color:'#7F77DD'}};
const cards=[
  {kind:'unit',name:'검은 숲 어스름 이리',type:'soldier',tier:'common',cost:1,atk:1,hp:1,sh:0,race:'horde',eff:'퇴장 — 적 킹 2딜'},
  {kind:'unit',name:'숨어든 모레아 피난민',type:'soldier',tier:'common',cost:2,atk:1,hp:5,sh:0,race:'human',eff:'바닐라 벽'},
  {kind:'unit',name:'산골짜기 견습 순찰대원',type:'scout',tier:'common',cost:2,atk:2,hp:1,sh:0,race:'human',eff:'신속'},
  {kind:'unit',name:'고위정령, 테르미아',type:'herald',tier:'legendary',cost:2,atk:1,hp:3,sh:0,race:'horde',eff:'밤→낮마다 공+2 체+2 영구 성장'},
  {kind:'unit',name:'침묵하는 나무 정령',type:'soldier',tier:'common',cost:3,atk:2,hp:8,sh:0,race:'horde',eff:'고정 — 벽 앵커'},
  {kind:'unit',name:'견습 사냥꾼 키레네아',type:'scout',tier:'epic',cost:3,atk:1,hp:2,sh:0,race:'human',eff:'사수 — 매 턴 1딜'},
  {kind:'unit',name:'검은 숲 추적자',type:'scout',tier:'rare',cost:3,atk:4,hp:1,sh:0,race:'human',eff:'쇄도 — 침투 피니셔'},
  {kind:'unit',name:'손짓하는 검은 숲 요정',type:'rider',tier:'epic',cost:4,atk:2,hp:2,sh:0,race:'horde',eff:'사수+기수 시너지'},
  {kind:'unit',name:'산골짜기 정예 순찰대원',type:'scout',tier:'rare',cost:4,atk:3,hp:3,sh:0,race:'human',eff:'신속'},
  {kind:'unit',name:'울부짖는 검은 숲 멧돼지',type:'rider',tier:'rare',cost:4,atk:5,hp:3,sh:0,race:'horde',eff:'신속 — 고공격'},
  {kind:'unit',name:'검은 숲 사냥꾼',type:'rider',tier:'common',cost:4,atk:2,hp:7,sh:0,race:'human',eff:'첫 격돌 공+2'},
  {kind:'unit',name:'검은 숲 어스름 늑대',type:'rider',tier:'epic',cost:5,atk:4,hp:3,sh:0,race:'horde',eff:'신속+쇄도'},
  {kind:'unit',name:'검은 숲 동굴 곰',type:'soldier',tier:'rare',cost:5,atk:6,hp:7,sh:0,race:'horde',eff:'등장 — 적 킹 1딜'},
  {kind:'unit',name:'칼리돈의 공포, 리카이온',type:'herald',tier:'legendary',cost:5,atk:4,hp:3,sh:0,race:'horde',eff:'등장/퇴장 각 킹 3딜'},
  {kind:'unit',name:'검은 숲 어스름 사슴',type:'soldier',tier:'common',cost:6,atk:3,hp:9,sh:0,race:'horde',eff:'등장 — 그 턴 특기 0'},
  {kind:'unit',name:'변덕스러운 어둠 요정',type:'shifting',tier:'epic',cost:6,atk:3,hp:7,sh:0,race:'horde',eff:'변동 — 시간대 가변'},
  {kind:'unit',name:'추적자, 라피테스',type:'herald',tier:'legendary',cost:7,atk:5,hp:3,sh:1,race:'human',eff:'신성+사수 — 자립'},
  {kind:'unit',name:'여왕, 악타이아',type:'herald',tier:'legendary',cost:7,atk:3,hp:8,sh:0,race:'horde',eff:'오라 — 밤 시야+전체 공+2'},
  {kind:'gear',name:'조악한 나무 활',type:'-',tier:'common',cost:1,race:null,eff:'대적자 〈사수〉+공+2. 1발'},
  {kind:'gear',name:'모레아 순찰대 투척 단도',type:'-',tier:'rare',cost:1,race:null,eff:'대적자 〈사수〉+공+1. 처치 시 유지'},
  {kind:'gear',name:'숲지기의 장궁',type:'-',tier:'rare',cost:3,race:null,eff:'대적자 〈사수〉 상시+공+1. 3발'},
  {kind:'spell',name:'바람의 칼날',type:'-',tier:'common',cost:0,race:null,eff:'대상 1명 피해1 (전부)'},
  {kind:'spell',name:'달빛의 가호',type:'-',tier:'epic',cost:2,race:null,eff:'인물 쇄도+드로우 1'},
  {kind:'spell',name:'바람의 가호',type:'-',tier:'rare',cost:2,race:null,eff:'인물 돌격 부여'},
  {kind:'spell',name:'그림자 칼날',type:'-',tier:'rare',cost:3,race:null,eff:'적 킹 4딜'},
  {kind:'spell',name:'돌개바람의 가호',type:'-',tier:'common',cost:3,race:null,eff:'이번 턴 2드로우 / 다음 턴 0'},
  {kind:'spell',name:'흐르는 물의 축복',type:'-',tier:'rare',cost:4,race:null,eff:'내 대적자 체력 3+3 회복'},
  {kind:'strat',name:'휘감는 덩굴',type:'-',tier:'common',cost:1,race:null,eff:'단일 칸 적 1턴 봉쇄'},
  {kind:'strat',name:'달빛의 인도',type:'-',tier:'rare',cost:3,race:null,eff:'세로 2칸 인물 공+2'},
  {kind:'strat',name:'산사태',type:'-',tier:'epic',cost:6,race:null,eff:'가로 3칸 즉시 3딜 무차별'}
];
const TARGET={unit:18,gear:3,spell:6,strat:3};
function cardEl(c){
  const t=TIER[c.tier]; let stat='';
  if(c.kind==='unit'){
    stat=`<span style="display:inline-flex;align-items:center;gap:3px;color:#993C1D;"><i class="ti ti-sword" aria-hidden="true"></i>${c.atk}</span><span style="display:inline-flex;align-items:center;gap:3px;"><i class="ti ti-heart" aria-hidden="true"></i>${c.hp}</span>`;
    if(c.sh)stat+=`<span style="display:inline-flex;align-items:center;gap:3px;color:#185FA5;"><i class="ti ti-shield" aria-hidden="true"></i>${c.sh}</span>`;
  }
  const sub=c.kind==='unit'?`<div style="font-size:11px;color:var(--color-text-secondary);">${TYPE[c.type]}${c.race?' · '+(c.race==='horde'?'무리':'인간'):''}</div>`:`<div style="font-size:11px;color:var(--color-text-secondary);">${KIND[c.kind].ko}</div>`;
  const statRow=stat?`<div style="display:flex;gap:10px;font-size:12.5px;font-weight:500;">${stat}</div>`:'';
  return `<div style="display:flex;flex-direction:column;gap:6px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:10px;"><div style="display:flex;align-items:center;justify-content:space-between;"><span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--color-background-tertiary);font-size:12px;font-weight:500;color:var(--color-text-primary);">${c.cost}</span><span style="font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:var(--border-radius-md);background:${t.bg};color:${t.fg};">${t.ko}</span></div><div style="font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.3;">${c.name}</div>${sub}${statRow}${c.eff?`<div style="font-size:11px;color:var(--color-text-tertiary);line-height:1.45;border-top:0.5px solid var(--color-border-tertiary);padding-top:5px;">${c.eff}</div>`:''}</div>`;
}
const head=(i,l)=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-secondary);margin:1.3rem 0 9px;"><i class="ti ${i}" aria-hidden="true"></i><span>${l}</span></div>`;
const grid=x=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">${x}</div>`;
const tIcon=tk=>tk==='soldier'?'ti-shield':tk==='rider'?'ti-run':tk==='scout'?'ti-eye':tk==='herald'?'ti-flag':tk==='shifting'?'ti-refresh':'ti-cards';
function analysisView(){
  let h=''; const tot=cards.length, units=cards.filter(c=>c.kind==='unit');
  const goal=Object.values(TARGET).reduce((a,b)=>a+b,0);
  const hbar=(label,n,total,color,note)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="width:42px;font-size:12px;color:var(--color-text-secondary);">${label}</span><div class="bar" style="width:${Math.max(n/total*100,8)}%;background:${color};">${n}</div>${note?`<span style="font-size:11px;color:var(--color-text-tertiary);">${note}</span>`:''}</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:6px;"><div class="mc"><div class="lab">완성</div><div class="num">${tot} <span style="font-size:14px;color:var(--color-text-tertiary);">/ ${goal}</span> <i class="ti ti-check" style="color:#3B6D11;font-size:18px;" aria-hidden="true"></i></div></div><div class="mc"><div class="lab">남은 카드</div><div class="num">0<span style="font-size:14px;color:var(--color-text-tertiary);">장</span></div></div></div>`;
  h+=head('ti-stack-2','종류별 — 전부 완성');
  for(const [k,info] of Object.entries(KIND)){
    const cur=cards.filter(c=>c.kind===k).length, tg=TARGET[k], done=cur>=tg;
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;"><span style="width:42px;font-size:12px;color:var(--color-text-secondary);">${info.ko}</span><div style="flex:1;height:22px;border-radius:4px;background:var(--color-background-tertiary);position:relative;overflow:hidden;"><div style="position:absolute;inset:0;width:${Math.min(cur/tg*100,100)}%;background:${info.color};border-radius:4px;"></div></div><span style="font-size:12px;color:var(--color-text-secondary);min-width:58px;">${cur} / ${tg}${done?' <i class="ti ti-check" style="color:#3B6D11;" aria-hidden="true"></i>':''}</span></div>`;
  }
  h+=head('ti-chart-bar','코스트 곡선 — 전체 30장 (종류 스택)');
  let maxc=0; const byc=[];
  for(let cc=0;cc<=7;cc++){const list=cards.filter(c=>c.cost===cc); byc[cc]=list; if(list.length>maxc)maxc=list.length;}
  h+='<div style="display:flex;align-items:flex-end;gap:8px;height:140px;padding:0 4px;">';
  for(let cc=0;cc<=7;cc++){
    const list=byc[cc]; let stack='';
    for(const [k,info] of Object.entries(KIND)){const n=list.filter(c=>c.kind===k).length; if(n)stack+=`<div style="background:${info.color};width:100%;height:${n/maxc*115}px;"></div>`;}
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="font-size:11px;color:var(--color-text-tertiary);">${list.length||''}</div><div style="width:100%;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;">${stack||'<div style="height:2px;background:var(--color-border-tertiary);"></div>'}</div><div style="font-size:11px;color:var(--color-text-secondary);">${cc}</div></div>`;
  }
  h+='</div>';
  h+=`<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--color-text-secondary);margin-top:8px;">${Object.values(KIND).map(i=>`<span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:${i.color};"></span>${i.ko}</span>`).join('')}</div>`;
  h+=head('ti-star','등급 분포');
  for(const [tk,info] of Object.entries(TIERBAR)){ h+=hbar(info.ko,cards.filter(c=>c.tier===tk).length,tot,info.c,''); }
  h+=head('ti-cards','타입 분포');
  h+=hbar('보병',units.filter(c=>c.type==='soldier').length,units.length,TYPECOLOR.soldier,'5');
  h+=hbar('척후',units.filter(c=>c.type==='scout').length,units.length,TYPECOLOR.scout,'4');
  h+=hbar('기수',units.filter(c=>c.type==='rider').length,units.length,TYPECOLOR.rider,'4');
  h+=hbar('전령',units.filter(c=>c.type==='herald').length,units.length,TYPECOLOR.herald,'4');
  h+=hbar('변동',units.filter(c=>c.type==='shifting').length,units.length,TYPECOLOR.shifting,'1');
  return h;
}
function render(mode){
  const out=document.getElementById('out'); let html='';
  if(mode==='analysis'){ out.innerHTML=analysisView(); document.querySelectorAll('.sortbtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); return; }
  if(mode==='group'){
    for(const [k,info] of Object.entries(KIND)){
      const list=cards.filter(c=>c.kind===k); if(!list.length) continue;
      if(k==='unit'){
        for(const [tk,tko] of Object.entries(TYPE)){ if(tk==='-')continue; const tl=list.filter(c=>c.type===tk).sort((a,b)=>a.cost-b.cost); if(!tl.length)continue; html+=head(tIcon(tk),`${tko} · ${tl.length}장`); html+=grid(tl.map(cardEl).join('')); }
      } else { html+=head(info.icon,`${info.ko} · ${list.length}장`); html+=grid(list.slice().sort((a,b)=>a.cost-b.cost).map(cardEl).join('')); }
    }
  } else if(mode==='cost'){
    for(let cc=0;cc<=7;cc++){ const cl=cards.filter(c=>c.cost===cc).sort((a,b)=>KIND[a.kind].ord-KIND[b.kind].ord); if(!cl.length)continue; html+=head('ti-droplet',`${cc} 코스트 · ${cl.length}장`); html+=grid(cl.map(cardEl).join('')); }
  } else if(mode==='tier'){
    for(const [tk,info] of Object.entries(TIER)){ const tl=cards.filter(c=>c.tier===tk).sort((a,b)=>a.cost-b.cost); if(!tl.length)continue; html+=head('ti-star',`${info.ko} · ${tl.length}장`); html+=grid(tl.map(cardEl).join('')); }
  }
  out.innerHTML=html;
  document.querySelectorAll('.sortbtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
}
document.querySelectorAll('.sortbtn').forEach(b=>b.addEventListener('click',()=>render(b.dataset.mode)));
render('analysis');
</script>
