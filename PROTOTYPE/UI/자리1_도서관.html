<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle — 자리 1: 도서관</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Serif KR', serif;
    background: #0e0c0a;
    color: #d4b078;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #0e0c0a;
    overflow: hidden;
  }
  .scene::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 45%, rgba(250,199,117,0.45) 0%, rgba(186,117,23,0.15) 35%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }
  .desk-line {
    position: absolute;
    bottom: 30%;
    left: 0; right: 0;
    height: 1px;
    background: #4a3622;
    z-index: 2;
  }
  .desk-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background: linear-gradient(to bottom, #15110d 0%, #0a0806 100%);
    z-index: 1;
  }
  .bookshelf {
    position: absolute;
    top: 12%; right: 4%;
    width: 28%; height: 45%;
    opacity: 0.18;
    z-index: 1;
  }
  .bookshelf .shelf {
    border: 1px solid #3a2c1d;
    border-bottom: none;
    height: 100%;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 0 8px;
  }
  .bookshelf .book {
    width: 14%;
    background: #2a1f15;
    border-radius: 1px;
  }
  .bookshelf .book:nth-child(2n) { background: #241a12; }
  .bookshelf .book:nth-child(1) { height: 65%; }
  .bookshelf .book:nth-child(2) { height: 75%; }
  .bookshelf .book:nth-child(3) { height: 60%; }
  .bookshelf .book:nth-child(4) { height: 80%; }
  .bookshelf .book:nth-child(5) { height: 70%; }

  .lamp {
    position: absolute;
    top: 18%; left: 12%;
    width: 70px; height: 110px;
    z-index: 3;
  }
  .lamp .base {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 50px; height: 12px;
    background: #3a2c1d;
    border-radius: 1px;
  }
  .lamp .stem {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 50px;
    background: #5a4530;
  }
  .lamp .shade {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 70px; height: 22px;
    background: #1a1208;
    border-radius: 50% / 30%;
  }
  .lamp .glow {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 28px; height: 38px;
    background: radial-gradient(ellipse, #FFE4B0 0%, #FAC775 50%, transparent 80%);
    border-radius: 50%;
    animation: flicker 3s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.95; }
    50% { opacity: 0.85; }
  }

  .book-stack {
    position: absolute;
    bottom: 22%; left: 18%;
    width: 100px;
    z-index: 4;
    opacity: 0.4;
  }
  .book-stack .b1 {
    width: 100px; height: 14px;
    background: #2a1f15;
    border: 0.5px solid #5a3a20;
    border-radius: 1px;
    transform: rotate(-2deg);
  }
  .book-stack .b2 {
    width: 95px; height: 14px;
    background: #241a12;
    border: 0.5px solid #5a3a20;
    border-radius: 1px;
    margin-top: -1px;
    margin-left: 4px;
    transform: rotate(1deg);
  }

  .center-book {
    position: absolute;
    bottom: 28%; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .center-book:hover, .center-book:active {
    transform: translateX(-50%) translateY(-4px);
  }
  .center-book .cover {
    width: 180px;
    height: 240px;
    background: linear-gradient(to bottom, #3a2418, #1f130b);
    border: 0.5px solid #5a3a20;
    position: relative;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .center-book .spine-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 8px; height: 100%;
    background: #0e0805;
  }
  .center-book .spine-edge {
    position: absolute;
    top: 0; left: 8px;
    width: 2px; height: 100%;
    background: #7a5230;
  }
  .center-book .frame {
    position: absolute;
    top: 8px; left: 14px; right: 6px; bottom: 8px;
    border: 0.5px solid #7a5230;
    opacity: 0.7;
  }
  .center-book .constellation {
    position: absolute;
    top: 32%; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 80px;
  }
  .center-book .constellation circle {
    fill: none;
    stroke: #c9a566;
    stroke-width: 0.8;
  }
  .center-book .constellation .star {
    fill: #FAC775;
  }
  .center-book .title {
    position: absolute;
    top: 70%; left: 0; right: 0;
    text-align: center;
    color: #d4b078;
    font-size: 18px;
    letter-spacing: 4px;
  }
  .center-book .subtitle {
    position: absolute;
    top: 80%; left: 0; right: 0;
    text-align: center;
    color: #9a7a4a;
    font-size: 11px;
    letter-spacing: 5px;
    font-style: italic;
  }

  .quill {
    position: absolute;
    bottom: 22%; left: 28%;
    z-index: 4;
    opacity: 0.55;
    transform: rotate(-15deg);
  }
  .quill .feather {
    width: 60px;
    height: 14px;
    background: #3a2818;
    border: 0.5px solid #5a3a20;
    clip-path: polygon(0 50%, 100% 20%, 95% 50%, 100% 80%);
  }
  .quill .nib {
    position: absolute;
    right: -28px; top: 0;
    width: 36px; height: 8px;
    background: linear-gradient(to right, #1a1208 60%, #9a7a4a 100%);
    transform: rotate(15deg);
  }

  .inkwell {
    position: absolute;
    bottom: 22%; right: 38%;
    width: 44px; height: 38px;
    z-index: 4;
    opacity: 0.5;
  }
  .inkwell .body {
    width: 44px; height: 32px;
    background: #2a1f15;
    border-radius: 50% 50% 8px 8px / 30% 30% 8px 8px;
    border: 0.5px solid #4a3622;
  }
  .inkwell .neck {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 8px;
    background: #1a1208;
    border-radius: 4px;
  }

  .menu {
    position: absolute;
    top: 32%; right: 12%;
    z-index: 6;
    text-align: left;
  }
  .menu-item {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    letter-spacing: 4px;
    padding: 10px 0;
    cursor: pointer;
    transition: all 0.25s ease;
    background: none;
    border: none;
    color: inherit;
    display: block;
    width: 100%;
    text-align: left;
  }
  .menu-item.active {
    color: #f5d99a;
    text-shadow: 0 0 12px rgba(250,199,117,0.4);
  }
  .menu-item.active:hover, .menu-item.active:active {
    color: #FFE4B0;
    text-shadow: 0 0 18px rgba(250,199,117,0.6);
    letter-spacing: 5px;
  }
  .menu-item.dim {
    color: #5a4a32;
    cursor: not-allowed;
    opacity: 0.55;
  }
  .menu-item.muted {
    color: #9a8458;
    opacity: 0.7;
  }
  .menu-item.muted:hover, .menu-item.muted:active {
    color: #d4b078;
    opacity: 0.95;
  }
  .menu-item.faint {
    color: #7a6848;
    opacity: 0.55;
  }
  .menu-item.faint:hover, .menu-item.faint:active {
    color: #9a8458;
    opacity: 0.85;
  }

  .footer {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #5a4a32;
    letter-spacing: 6px;
    opacity: 0.55;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer .line {
    display: inline-block;
    width: 24px; height: 1px;
    background: #7a5230;
  }

  .stage-label {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 7;
    font-size: 10px;
    color: #5a4a32;
    letter-spacing: 3px;
    background: rgba(0,0,0,0.4);
    padding: 4px 10px;
    border: 0.5px solid #3a2c1d;
    border-radius: 2px;
  }

  .toast {
    position: absolute;
    bottom: 12%; left: 50%;
    transform: translateX(-50%);
    background: rgba(20,15,10,0.92);
    border: 0.5px solid #5a3a20;
    color: #d4b078;
    padding: 10px 20px;
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    border-radius: 2px;
  }
  .toast.show { opacity: 1; }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
    z-index: 50;
  }

  @media (max-width: 600px) {
    .center-book .cover { width: 140px; height: 190px; }
    .center-book .title { font-size: 14px; letter-spacing: 3px; }
    .center-book .subtitle { font-size: 9px; letter-spacing: 4px; }
    .menu-item { font-size: 18px; letter-spacing: 3px; padding: 8px 0; }
    .menu { top: 28%; right: 6%; }
    .lamp { left: 4%; width: 50px; height: 80px; }
    .bookshelf { width: 32%; opacity: 0.14; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="stage-label">단계 0 — 첫 진입</div>

  <div class="desk-floor"></div>
  <div class="desk-line"></div>

  <div class="bookshelf">
    <div class="shelf">
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
      <div class="book"></div>
    </div>
  </div>

  <div class="lamp">
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="stem"></div>
    <div class="base"></div>
  </div>

  <div class="book-stack">
    <div class="b1"></div>
    <div class="b2"></div>
  </div>

  <div class="quill">
    <div class="feather"></div>
    <div class="nib"></div>
  </div>

  <div class="inkwell">
    <div class="neck"></div>
    <div class="body"></div>
  </div>

  <button class="center-book" onclick="openBook()" aria-label="테오도라의 책 열기">
    <div class="cover">
      <div class="spine-shadow"></div>
      <div class="spine-edge"></div>
      <div class="frame"></div>
      <svg class="constellation" viewBox="-50 -50 100 100">
        <circle cx="0" cy="0" r="32" stroke-opacity="0.85"/>
        <circle cx="0" cy="0" r="20" stroke-opacity="0.6"/>
        <circle class="star" cx="0" cy="-32" r="2.5"/>
        <circle cx="22" cy="-22" r="2"/>
        <circle class="star" cx="32" cy="0" r="2.5"/>
        <circle cx="22" cy="22" r="2"/>
        <circle class="star" cx="0" cy="32" r="2.5"/>
        <circle cx="-22" cy="22" r="2"/>
        <circle class="star" cx="-32" cy="0" r="2.5"/>
        <circle cx="-22" cy="-22" r="2"/>
      </svg>
      <div class="title">테오도라</div>
      <div class="subtitle">사생아</div>
    </div>
  </button>

  <nav class="menu">
    <button class="menu-item active" onclick="goStory()">이야기</button>
    <button class="menu-item dim" disabled>이어하기</button>
    <button class="menu-item muted" onclick="showToast('기록 — 다음 자리에서 박힘')">기록</button>
    <button class="menu-item muted" onclick="showToast('설정 — 다음 자리에서 박힘')">설정</button>
    <button class="menu-item faint" onclick="showToast('종료 — 게임 종료 결')">종료</button>
  </nav>

  <div class="footer">
    <span class="line"></span>
    <span>CHRONICLE</span>
    <span class="line"></span>
  </div>

  <div class="vignette"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function openBook() {
    showToast('책 펼침 → 자리 3 (인물 페이지) — 다음 마디');
  }
  function goStory() {
    showToast('[이야기] → 자리 2 (인물 목록) — 다음 마디');
  }
</script>
</body>
</html>
